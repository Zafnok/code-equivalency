# Static SonarQube Cloud config; project key/organization/token/host are supplied at
# scan time via .github/workflows/sonar.yml (secrets, PR context). See ADR 0009.
sonar.exclusions=samples/**,**/bin/**,**/obj/**
sonar.coverage.exclusions=samples/**
sonar.cs.opencover.reportsPaths=TestResults/**/*.opencover.*.xml
