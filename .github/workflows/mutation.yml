name: Mutation testing

on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    # Not a required check yet: MTP support in Stryker 5 is new (see QUALITY-GATES.md).
    # Blocking from M2.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { src: Equiv.Core, test: Equiv.Core.Tests }
          - { src: Equiv.Cli, test: Equiv.Cli.Tests }
          - { src: Equiv.Frontend.CSharp, test: Equiv.Frontend.CSharp.Tests }
          - { src: Equiv.Verify.Z3, test: Equiv.Verify.Z3.Tests }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode
      - run: dotnet tool restore

      - name: Run Stryker (${{ matrix.project.src }})
        working-directory: tests/${{ matrix.project.test }}
        run: >
          dotnet stryker
          --test-runner mtp
          --project ${{ matrix.project.src }}.csproj
          --target-framework net10.0
          --reporter html
          --reporter progress
          --output ${{ github.workspace }}/StrykerOutput/${{ matrix.project.src }}

      - name: Upload mutation report (${{ matrix.project.src }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report-${{ matrix.project.src }}
          path: StrykerOutput/${{ matrix.project.src }}/**/reports/*.html
          if-no-files-found: warn
