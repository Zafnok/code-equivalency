name: Mutation testing

on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    # Blocking since M0-011: --break-at below fails the job, and each matrix leg is a
    # required check (see QUALITY-GATES.md). A leg with no mutants (no score) still passes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { src: Equiv.Core, test: Equiv.Core.Tests }
          - { src: Equiv.Cli, test: Equiv.Cli.Tests }
          - { src: Equiv.Frontend.CSharp, test: Equiv.Frontend.CSharp.Tests }
          - { src: Equiv.Verify.Z3, test: Equiv.Verify.Z3.Tests }
          - { src: Equiv.Execute, test: Equiv.Execute.Tests }
    env:
      PASS_KEY_PREFIX: ci-pass-stryker-${{ matrix.project.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --since diffs against the base commit (the merge ref's first parent), so it must be in
          # the clone.
          fetch-depth: 0

      # A PR push whose code inputs (everything but prose; see the script) match an earlier
      # passing run of this leg in the same PR skips Stryker and reports that pass, same as
      # ci.yml's gates. The nightly full sweep never reuses or records a pass.
      - name: Fingerprint code inputs
        id: fp
        shell: bash
        run: echo "hash=$(bash .github/scripts/code-fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: Look up an earlier pass on the same code
        id: pass
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ${{ env.PASS_KEY_PREFIX }}-${{ steps.fp.outputs.hash }}
          lookup-only: true

      - name: Reuse the earlier pass
        if: steps.pass.outputs.cache-hit == 'true'
        run: echo "::notice::Stryker (${{ matrix.project.src }}) already passed on code fingerprint ${{ steps.fp.outputs.hash }}; this push changed only prose, so it is not re-run."

      # A PR run diffs against the merge commit's first parent: the base this run's merge ref
      # was built on. origin/<base> at job time is wrong whenever the base has moved since
      # (another PR merged while this one queued, or a re-run), because Stryker diffs that
      # commit's tree against the working tree, so the base's own new changes count as this
      # PR's: an M3-013 re-run mutated 25 IR files the PR never touched. Stryker only mutates
      # changed .cs files of the leg's own project (test paths are ignored, see
      # .github/stryker-pr-config.json), so a PR that changes none has no mutants, and the
      # leg reports a pass without paying for the build, the initial test run and coverage.
      - name: Scope the incremental run
        id: scope
        if: github.event_name == 'pull_request' && steps.pass.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet HEAD^2 > /dev/null || { echo "::error::HEAD is not the PR merge commit"; exit 1; }
          base=$(git rev-parse HEAD^1)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- 'src/${{ matrix.project.src }}/*.cs'; then
            echo "mutants=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This PR changes no .cs file in src/${{ matrix.project.src }}, so Stryker has no mutants to test on this leg; it passes without running."
          else
            echo "mutants=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$base" HEAD -- 'src/${{ matrix.project.src }}/*.cs'
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.pass.outputs.cache-hit != 'true' && steps.scope.outputs.mutants != 'false'
        with:
          global-json-file: global.json

      - if: steps.pass.outputs.cache-hit != 'true' && steps.scope.outputs.mutants != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3-feed
          key: z3-feed-${{ hashFiles('tools/z3-feed/*.sha256') }}
      - name: Fetch Microsoft.Z3 (ADR 0030)
        if: steps.pass.outputs.cache-hit != 'true' && steps.scope.outputs.mutants != 'false'
        shell: pwsh
        run: ./tools/z3-feed/fetch.ps1
      - if: steps.pass.outputs.cache-hit != 'true' && steps.scope.outputs.mutants != 'false'
        run: dotnet restore --locked-mode
      - if: steps.pass.outputs.cache-hit != 'true' && steps.scope.outputs.mutants != 'false'
        run: dotnet tool restore

      # PRs mutate only the src files they changed (diff target and ignored test paths: see the
      # scope step and .github/stryker-pr-config.json); the nightly run is a full sweep.
      # CsCheck_Threads=1: CsCheck samples on every core by default, so four Stryker workers
      # each running a property test on four threads oversubscribe the 4-vCPU runner, and a
      # starved run can be cut off as a Timeout, which costs a full timeout plus a test-server
      # restart on the MTP runner.
      - name: Run Stryker (${{ matrix.project.src }})
        if: steps.pass.outputs.cache-hit != 'true' && steps.scope.outputs.mutants != 'false'
        working-directory: tests/${{ matrix.project.test }}
        env:
          CsCheck_Threads: 1
        run: >
          dotnet stryker
          --test-runner mtp
          --project ${{ matrix.project.src }}.csproj
          --target-framework net10.0
          --concurrency 4
          --break-at 90
          ${{ github.event_name == 'pull_request' && format('--config-file {0}/.github/stryker-pr-config.json --since:{1}', github.workspace, steps.scope.outputs.base) || '' }}
          --skip-version-check
          --reporter html
          --reporter progress
          --output ${{ github.workspace }}/StrykerOutput/${{ matrix.project.src }}

      - name: Upload mutation report (${{ matrix.project.src }})
        if: always() && steps.pass.outputs.cache-hit != 'true' && steps.scope.outputs.mutants != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report-${{ matrix.project.src }}
          path: StrykerOutput/${{ matrix.project.src }}/**/reports/*.html
          if-no-files-found: warn

      - name: Record the pass for this code
        if: github.event_name == 'pull_request' && steps.pass.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "${{ github.sha }}" > "$RUNNER_TEMP/ci-pass/marker"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request' && steps.pass.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ${{ env.PASS_KEY_PREFIX }}-${{ steps.fp.outputs.hash }}

  # The differential soundness gate's nightly budget (VERIFICATION-MODEL.md section 7, M0-012): the
  # same DifferentialSoundnessTests every PR runs with 200 pairs in the Windows gates leg, run with
  # 5,000. On a failure the log holds the seed; EQUIV_DIFFERENTIAL_SEED replays it locally.
  differential:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3-feed
          key: z3-feed-${{ hashFiles('tools/z3-feed/*.sha256') }}
      - name: Fetch Microsoft.Z3 (ADR 0030)
        shell: pwsh
        run: ./tools/z3-feed/fetch.ps1
      - run: dotnet restore --locked-mode
      - name: Run the differential soundness gate (5,000 pairs)
        env:
          EQUIV_DIFFERENTIAL_BUDGET: nightly
        run: dotnet test --project tests/Equiv.Tests.Integration --no-restore -- --filter-class Equiv.Tests.Integration.DifferentialSoundnessTests
