name: Mutation testing

on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    # Blocking since M0-011: --break-at below fails the job, and each matrix leg is a
    # required check (see QUALITY-GATES.md). A leg with no mutants (no score) still passes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { src: Equiv.Core, test: Equiv.Core.Tests }
          - { src: Equiv.Cli, test: Equiv.Cli.Tests }
          - { src: Equiv.Frontend.CSharp, test: Equiv.Frontend.CSharp.Tests }
          - { src: Equiv.Verify.Z3, test: Equiv.Verify.Z3.Tests }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --since diffs against the base branch, so it must be in the clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode
      - run: dotnet tool restore

      # Microsoft.Z3 4.12.2 ships libz3 for win-x64 and osx-x64 only (ticket M3-001 Notes). The
      # z3-solver 4.12.2.0 manylinux wheel on PyPI carries the same version's libz3.so; pip checks
      # it against the hash PyPI publishes, and .NET's dlopen finds it on LD_LIBRARY_PATH.
      - name: Provide libz3 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "z3-solver==4.12.2.0 --hash=sha256:03921d3021cb6e5dbeaeb94634132a5fbf5403748aa21774efac4047e633af1e" > "$RUNNER_TEMP/z3-requirements.txt"
          python3 -m pip download --no-deps --only-binary=:all: --platform manylinux2014_x86_64 --python-version 3.12 \
            --require-hashes -r "$RUNNER_TEMP/z3-requirements.txt" -d "$RUNNER_TEMP/z3"
          python3 -m zipfile -e "$RUNNER_TEMP"/z3/z3_solver-4.12.2.0-*.whl "$RUNNER_TEMP/z3/wheel"
          test -f "$RUNNER_TEMP/z3/wheel/z3/lib/libz3.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/z3/wheel/z3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # PRs mutate only files changed against the base branch; the nightly run is a full sweep.
      - name: Run Stryker (${{ matrix.project.src }})
        working-directory: tests/${{ matrix.project.test }}
        run: >
          dotnet stryker
          --test-runner mtp
          --project ${{ matrix.project.src }}.csproj
          --target-framework net10.0
          --concurrency 4
          --break-at 90
          ${{ github.event_name == 'pull_request' && format('--since:origin/{0}', github.base_ref) || '' }}
          --reporter html
          --reporter progress
          --output ${{ github.workspace }}/StrykerOutput/${{ matrix.project.src }}

      - name: Upload mutation report (${{ matrix.project.src }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report-${{ matrix.project.src }}
          path: StrykerOutput/${{ matrix.project.src }}/**/reports/*.html
          if-no-files-found: warn
