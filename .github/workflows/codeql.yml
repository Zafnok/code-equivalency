name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ADR 0030: NuGet.config maps Microsoft.Z3 only to this local feed. build-mode: none below
      # does not compile, but keeping this step here means the workflow never silently drifts if
      # that changes.
      - name: Fetch Microsoft.Z3 (ADR 0030)
        shell: pwsh
        run: ./tools/z3-feed/fetch.ps1

      # build-mode: none does source-based extraction with no compile step, so it isn't
      # tripped up by dotnet build's persistent MSBuild/VBCSCompiler server running outside
      # CodeQL's traced process tree (manual mode + `dotnet build` reproducibly failed with
      # "didn't build any of it, or CodeQL could not process any of it" on this repo).
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:csharp"
