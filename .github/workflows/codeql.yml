name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-mode: none does source-based extraction with no compile step, so it isn't
      # tripped up by dotnet build's persistent MSBuild/VBCSCompiler server running outside
      # CodeQL's traced process tree (manual mode + `dotnet build` reproducibly failed with
      # "didn't build any of it, or CodeQL could not process any of it" on this repo).
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:csharp"
