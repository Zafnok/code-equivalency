name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # -Integration needs VS Build Tools + the .NET Framework 4.8 targeting pack,
      # which only the windows-latest hosted runner has (see README).
      - name: Run gates (Windows, with integration tests)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Integration

      - name: Run gates
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Upload cobertura reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-${{ matrix.os }}
          path: TestResults/**/*.cobertura.*.xml
          if-no-files-found: error

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary-${{ matrix.os }}
          path: TestResults/coverage-summary.txt
          if-no-files-found: error

  vulnerable-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode

      - name: Fail on known-vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          report=$(dotnet list package --vulnerable --include-transitive)
          echo "$report"
          if grep -q "has the following vulnerable packages" <<< "$report"; then
            echo "::error::Vulnerable NuGet packages detected (see report above)."
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
