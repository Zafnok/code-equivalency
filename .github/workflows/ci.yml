name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PASS_KEY_PREFIX: ci-pass-gates-${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A PR push whose code inputs (everything but prose; see the script) match a run that
      # already passed on this leg, in this PR or on main, skips the gates and reports that
      # pass. The job itself still runs, so the required check keeps its name and goes green.
      - name: Fingerprint code inputs
        id: fp
        shell: bash
        run: echo "hash=$(bash .github/scripts/code-fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: Look up an earlier pass on the same code
        id: pass
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ${{ env.PASS_KEY_PREFIX }}-${{ steps.fp.outputs.hash }}
          lookup-only: true

      - name: Reuse the earlier pass
        if: steps.pass.outputs.cache-hit == 'true'
        shell: bash
        run: echo "::notice::gates already passed on code fingerprint ${{ steps.fp.outputs.hash }}; this push changed only prose, so the gates are not re-run."

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.pass.outputs.cache-hit != 'true'
        with:
          global-json-file: global.json

      # Microsoft.Z3 4.12.2 ships libz3 for win-x64 and osx-x64 only (ticket M3-001 Notes). The
      # z3-solver 4.12.2.0 manylinux wheel on PyPI carries the same version's libz3.so; pip checks
      # it against the hash PyPI publishes, and .NET's dlopen finds it on LD_LIBRARY_PATH.
      - name: Provide libz3 (Linux)
        if: runner.os == 'Linux' && steps.pass.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "z3-solver==4.12.2.0 --hash=sha256:03921d3021cb6e5dbeaeb94634132a5fbf5403748aa21774efac4047e633af1e" > "$RUNNER_TEMP/z3-requirements.txt"
          python3 -m pip download --no-deps --only-binary=:all: --platform manylinux2014_x86_64 --python-version 3.12 \
            --require-hashes -r "$RUNNER_TEMP/z3-requirements.txt" -d "$RUNNER_TEMP/z3"
          python3 -m zipfile -e "$RUNNER_TEMP"/z3/z3_solver-4.12.2.0-*.whl "$RUNNER_TEMP/z3/wheel"
          test -f "$RUNNER_TEMP/z3/wheel/z3/lib/libz3.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/z3/wheel/z3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # -Integration needs VS Build Tools + the .NET Framework 4.8 targeting pack,
      # which only the windows-latest hosted runner has (see README).
      - name: Run gates (Windows, with integration tests)
        if: runner.os == 'Windows' && steps.pass.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build.ps1 -Integration

      - name: Run gates
        if: runner.os != 'Windows' && steps.pass.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build.ps1

      - name: Upload cobertura reports
        if: always() && steps.pass.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-${{ matrix.os }}
          path: TestResults/**/*.cobertura.*.xml
          if-no-files-found: error

      - name: Upload coverage summary
        if: always() && steps.pass.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary-${{ matrix.os }}
          path: TestResults/coverage-summary.txt
          if-no-files-found: error

      # Only reached when every step above passed. Saved on main pushes too, so a PR that
      # changes only prose on top of a green main skips the gates from its first push.
      - name: Record the pass for this code
        if: steps.pass.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "${{ github.sha }}" > "$RUNNER_TEMP/ci-pass/marker"

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.pass.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ${{ env.PASS_KEY_PREFIX }}-${{ steps.fp.outputs.hash }}

  vulnerable-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode

      - name: Fail on known-vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          report=$(dotnet list package --vulnerable --include-transitive)
          echo "$report"
          if grep -q "has the following vulnerable packages" <<< "$report"; then
            echo "::error::Vulnerable NuGet packages detected (see report above)."
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
