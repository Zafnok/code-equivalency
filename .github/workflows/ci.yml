name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PASS_KEY_PREFIX: ci-pass-gates-${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A PR push whose code inputs (everything but prose; see the script) match a run that
      # already passed on this leg, in this PR or on main, skips the gates and reports that
      # pass. The job itself still runs, so the required check keeps its name and goes green.
      - name: Fingerprint code inputs
        id: fp
        shell: bash
        run: echo "hash=$(bash .github/scripts/code-fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: Look up an earlier pass on the same code
        id: pass
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ${{ env.PASS_KEY_PREFIX }}-${{ steps.fp.outputs.hash }}
          lookup-only: true

      - name: Reuse the earlier pass
        if: steps.pass.outputs.cache-hit == 'true'
        shell: bash
        run: echo "::notice::gates already passed on code fingerprint ${{ steps.fp.outputs.hash }}; this push changed only prose, so the gates are not re-run."

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.pass.outputs.cache-hit != 'true'
        with:
          global-json-file: global.json

      # build.ps1 runs tools/z3-feed/fetch.ps1, which is a no-op when the cached nupkg matches its
      # pinned hash (ADR 0030), so most runs skip the 65 MB release download.
      - name: Cache the Microsoft.Z3 feed
        if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3-feed
          key: z3-feed-${{ hashFiles('tools/z3-feed/*.sha256') }}

      # -Integration needs VS Build Tools + the .NET Framework 4.8 targeting pack,
      # which only the windows-latest hosted runner has (see README).
      - name: Run gates (Windows, with integration tests)
        if: runner.os == 'Windows' && steps.pass.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build.ps1 -Integration

      - name: Run gates
        if: runner.os != 'Windows' && steps.pass.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build.ps1

      - name: Upload cobertura reports
        if: always() && steps.pass.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-${{ matrix.os }}
          path: TestResults/**/*.cobertura.*.xml
          if-no-files-found: error

      - name: Upload coverage summary
        if: always() && steps.pass.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary-${{ matrix.os }}
          path: TestResults/coverage-summary.txt
          if-no-files-found: error

      # Only reached when every step above passed. Saved on main pushes too, so a PR that
      # changes only prose on top of a green main skips the gates from its first push.
      - name: Record the pass for this code
        if: steps.pass.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "${{ github.sha }}" > "$RUNNER_TEMP/ci-pass/marker"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pass.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ${{ env.PASS_KEY_PREFIX }}-${{ steps.fp.outputs.hash }}

  # ADR 0031 (M3-029): Linux must produce the same SARIF results as Windows. Each leg runs `equiv compare` on every
  # samples/* pair (Windows through MSBuildWorkspace and VS Build Tools, Ubuntu through the bare loader for the
  # non-SDK sides); `parity` diffs the two, ignoring paths.
  parity-run:
    name: parity-run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      EQUIV_REFERENCE_ASSEMBLIES: ${{ github.workspace }}/.reference-assemblies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3-feed
          key: z3-feed-${{ hashFiles('tools/z3-feed/*.sha256') }}

      # The bare loader fetches Microsoft.NETFramework.ReferenceAssemblies.<tfm> on first use (M3-029); the samples
      # need net48 only, so one cached copy keeps the leg off nuget.org.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .reference-assemblies
          key: reference-assemblies-1.0.3-${{ runner.os }}

      - name: Fetch Microsoft.Z3 (ADR 0030)
        shell: pwsh
        run: ./tools/z3-feed/fetch.ps1

      - run: dotnet restore --locked-mode

      - name: Compare every sample
        shell: pwsh
        run: ./.github/scripts/parity-run.ps1 -OutDir parity/${{ runner.os }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-${{ runner.os }}
          path: parity/${{ runner.os }}
          if-no-files-found: error

  parity:
    needs: parity-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: parity-*
          path: parity

      - name: Diff the SARIF results of Windows and Ubuntu
        shell: pwsh
        run: ./.github/scripts/sarif-parity.ps1 -Left parity/parity-Windows -Right parity/parity-Linux

  vulnerable-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3-feed
          key: z3-feed-${{ hashFiles('tools/z3-feed/*.sha256') }}

      - name: Fetch Microsoft.Z3 (ADR 0030)
        shell: pwsh
        run: ./tools/z3-feed/fetch.ps1

      - run: dotnet restore --locked-mode

      - name: Fail on known-vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          report=$(dotnet list package --vulnerable --include-transitive)
          echo "$report"
          if grep -q "has the following vulnerable packages" <<< "$report"; then
            echo "::error::Vulnerable NuGet packages detected (see report above)."
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
