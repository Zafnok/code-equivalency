name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    # Not a required check yet: needs calibrating against a few real PRs first (ADR 0009).
    # Promoted once stable, same rollout pattern as mutation.yml (M0-004).
    continue-on-error: true
    # Dependabot-triggered runs get no Actions secrets, so SONAR_TOKEN is empty and the scanner
    # fails before analysing anything. Version bumps carry no code for Sonar to grade anyway.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The scanner CLI runs on a JVM; the .NET tool doesn't bundle one.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .z3-feed
          key: z3-feed-${{ hashFiles('tools/z3-feed/*.sha256') }}
      - name: Fetch Microsoft.Z3 (ADR 0030)
        shell: pwsh
        run: ./tools/z3-feed/fetch.ps1
      - run: dotnet restore --locked-mode
      - run: dotnet tool restore

      # SonarScanner for .NET does not read sonar-project.properties (it errors out if
      # one exists in the repo root); every setting is a scanner CLI arg instead.
      # Coverage is a src/ measure (QUALITY-GATES.md, Coverage row): PowerShell scripts and
      # Bicep have no test harness, so they are left out of coverage only. Sonar still
      # analyses them for bugs and vulnerabilities (M6-001: its .ps1 files tripped new-code coverage).
      # The same holds for tools/spikes/: throwaway measurement tools no gate builds or tests
      # (P1-037: its Python files tripped new-code coverage).
      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"Zafnok_code-equivalency"
          /o:"zafnok"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.exclusions="samples/**,**/bin/**,**/obj/**"
          /d:sonar.coverage.exclusions="samples/**,**/*.ps1,**/*.bicep,tools/spikes/**"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/*.opencover.*.xml"
          /d:sonar.coverageReportPaths="TestResults/pester-coverage.xml"

      # -SonarBuild: the analyzer injected by `begin` would otherwise turn its own
      # findings into compiler errors (-warnaserror) and formatting diffs
      # (--verify-no-changes), failing the build before Sonar ever gets a report to
      # grade. Both gates still run unmodified in ci.yml; this job only feeds Sonar
      # Cloud, whose quality gate already scopes itself to new code (see ADR 0009).
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -SonarBuild

      # PowerShell coverage (P2-063): the Pester tests under tools/, converted to Sonar's generic
      # coverage format, the only one it imports for PowerShell. A line is covered when any command
      # on it ran. The test files are measured too (ExcludeTests off): Sonar indexes them as source,
      # so a line it has no report for counts as uncovered. Inline for the same reason: a script
      # here would be source nothing covers. After the build, whose test step clears TestResults/.
      - name: Pester tests with coverage
        shell: pwsh
        run: |
          $tests = @((Get-ChildItem tools -Recurse -Filter *.Tests.ps1).FullName)
          $config = New-PesterConfiguration
          $config.Run.Path = $tests
          $config.Run.PassThru = $true
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @((Resolve-Path tools/corpus/corpus.ps1).Path) + $tests
          $config.CodeCoverage.ExcludeTests = $false
          $config.CodeCoverage.OutputPath = 'TestResults/pester-jacoco.xml'
          $coverage = (Invoke-Pester -Configuration $config).CodeCoverage
          $commands = @($coverage.CommandsMissed | ForEach-Object { [pscustomobject]@{ File = $_.File; Line = $_.Line; Covered = $false } }) +
              @($coverage.CommandsExecuted | ForEach-Object { [pscustomobject]@{ File = $_.File; Line = $_.Line; Covered = $true } })
          $files = $commands | Group-Object File | ForEach-Object {
              $lines = $_.Group | Group-Object Line | ForEach-Object {
                  '<lineToCover lineNumber="{0}" covered="{1}"/>' -f $_.Name, "$(@($_.Group.Covered) -contains $true)".ToLowerInvariant()
              }
              Write-Host ("{0}: {1} lines measured" -f $_.Name, @($lines).Count)
              '<file path="{0}">{1}</file>' -f [IO.Path]::GetRelativePath($PWD.Path, $_.Name).Replace('\', '/'), ($lines -join '')
          }
          Set-Content -Path TestResults/pester-coverage.xml -Value ('<coverage version="1">{0}</coverage>' -f ($files -join ''))

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
